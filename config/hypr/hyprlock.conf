# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf
#

$font = Sans

general {
    hide_cursor = false
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
    animation = inputFieldColors, 1, 2, linear
}

background {
    monitor =
    color = rgb(282828)
    #path = ~/.config/hypr/wallpapers/1920x1080-dark-linux.png
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgb(1D2021)

    outer_color = rgb(98971A)
    check_color = rgb(458588)
    fail_color = rgb(CC241D)
    capslock_color = rgb(98971A) rgb(458588) 180deg
    numlock_color = rgb(98971A) rgb(458588)  0deg
    bothlock_color = rgb(458588) rgb(98971A) rgb(458588) 0deg

    font_color = rgb(EBDBB2)
    fade_on_empty = false
    rounding = 5

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL$FPRINTFAIL

    check_text = Authenticating...

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -150
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME12 # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 120
    font_family = $font
    color = rgb(EBDBB2) 

    position = 0, 150
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 40
    font_family = $font
    color = rgb(D79921)

    position = 0, 40
    halign = center
    valign = center
}

# Welcome back <User>
label {
    monitor =
    text = Welcome back, $USER
    font_size = 20
    font_family = $font
    color = rgb(689D9A)

    position = 0, -90
    halign = center
    valign = center
}
