general {
    lock_cmd = pidof hyprlock || hyprlock >> /home/quinn/.local/state/hyprlock.log  # dbus/sysd lock command (loginctl lock-session)
    unlock_cmd =                            # same as above, but unlock
    before_sleep_cmd = loginctl lock-session # command ran before sleep
    after_sleep_cmd = hyprctl dispatch dpms on                       # command ran after sleep
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
    ignore_systemd_inhibit = false          # whether to ignore systemd-inhibit --what=idle inhibitors
}

listener {
    timeout = 300                            # in seconds
    on-timeout = loginctl lock-session && hyprctl dispatch dpms off # command to run when timeout has passed
    on-resume = hyprctl dispatch dpms on                              # command to run when activity is detected after timeout has fired.
    condition_cmd =                          # if set, run this command before on-timeout. Exit 0 = proceed, non-zero = defer
    condition_retry = 0                      # retry interval in seconds when condition_cmd defers (default: 0, no retry)
}

listener {
    timeout = 600                            # in seconds
    on-timeout = systemctl suspend-then-hibernate           # command to run when timeout has passed
    on-resume =                              # command to run when activity is detected after timeout has fired.
    condition_cmd =                          # if set, run this command before on-timeout. Exit 0 = proceed, non-zero = defer
    condition_retry = 0                      # retry interval in seconds when condition_cmd defers (default: 0, no retry)
}
